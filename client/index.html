<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>hanabi-room</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <h1>hanabi-room</h1>
      <span id="me" hidden></span>
      <div id="size-controls" aria-label="UI size">
        <button type="button" data-size="S" title="Small">S</button>
        <button type="button" data-size="M" title="Medium">M</button>
        <button type="button" data-size="L" title="Large">L</button>
        <button type="button" data-size="XL" title="Extra large">XL</button>
      </div>
      <span id="status">connecting…</span>
    </header>
    <main id="app">
      <section id="join-screen" class="screen">
        <h2>Welcome</h2>
        <form id="join-form">
          <label>
            Your name
            <input id="name-input" required maxlength="24" autocomplete="off" />
          </label>
          <button type="submit">Continue</button>
        </form>
      </section>

      <section id="server-lobby-screen" class="screen" hidden>
        <div class="server-lobby-header">
          <h2>Rooms</h2>
          <form id="create-room-form">
            <input id="create-room-name" maxlength="40" placeholder="Room name (optional)" autocomplete="off" />
            <button type="submit">Create room</button>
          </form>
        </div>
        <div id="rooms-list"></div>
        <h3>Resumable saved games</h3>
        <div id="resumable-saves"></div>
        <details id="library-section">
          <summary>Game library</summary>
          <div id="library-list"></div>
        </details>
        <details id="stats-section">
          <summary>Player stats</summary>
          <div id="stats-filters">
            <label>
              Players
              <select id="stats-players"><option value="">All</option></select>
            </label>
            <label>
              Game type
              <select id="stats-variant"><option value="">All</option></select>
            </label>
            <label>
              From
              <input id="stats-from" type="date" />
            </label>
            <label>
              To
              <input id="stats-to" type="date" />
            </label>
            <button id="stats-dates-clear" type="button" title="Clear the date range">Any date</button>
            <span id="stats-scope"></span>
          </div>
          <div id="stats-people">
            <span class="stats-people-label">Featuring</span>
            <span id="stats-people-list"></span>
          </div>
          <div id="stats-tags">
            <span class="stats-people-label">Tags</span>
            <span id="stats-tags-list"></span>
          </div>
          <div id="stats-table"></div>
        </details>
      </section>

      <section id="lobby-screen" class="screen" hidden>
        <h2>Lobby</h2>
        <div id="lobby-players"></div>
        <div id="lobby-spectators" hidden></div>
        <button id="add-bot-button" type="button">+ Add bot</button>
        <fieldset id="lobby-options">
          <legend>Game options (host only)</legend>
          <label>
            Variant
            <select id="opt-variant"></select>
          </label>
          <label>
            End rule
            <select id="opt-endRule">
              <option value="standard">Standard (one final round after deck empties)</option>
              <option value="lax">Lax (play until all hands are empty)</option>
            </select>
          </label>
          <label class="checkbox">
            <input type="checkbox" id="opt-shareGuarded" />
            Share guarded cards (other players see the red marker)
          </label>
          <label class="checkbox">
            <input type="checkbox" id="opt-allowEmptyHints" />
            Allow hints that touch no cards (useful as a negative-information signal)
          </label>
          <label class="checkbox">
            <input type="checkbox" id="opt-allowSpectators" />
            Allow spectators to watch this room (they see every hand and cannot act)
          </label>
          <label>
            Seed (optional — paste from a previous game to re-deal the same deck)
            <input id="opt-seed" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="random" />
          </label>
          <div id="import-deck-row">
            <label class="import-label">
              Import deck order (optional — JSON exported from a previous game)
              <input id="import-deck-file" type="file" accept=".json,application/json" />
            </label>
            <div id="import-deck-status" hidden></div>
          </div>
          <button id="start-button" type="button">Start game</button>
        </fieldset>
      </section>

      <section id="game-screen" class="screen" hidden>
        <div id="replay-bar" hidden>
          <span class="replay-title">Review</span>
          <button id="replay-first" type="button" title="Start (Home)">⏮</button>
          <button id="replay-prev" type="button" title="Back one move (←)">◀</button>
          <span id="replay-pos"></span>
          <button id="replay-next" type="button" title="Forward one move (→)">▶</button>
          <button id="replay-last" type="button" title="End (End key)">⏭</button>
          <button id="replay-branch" type="button" title="Open a new room continuing from this point">Play from here</button>
          <button id="replay-close" type="button">Close review</button>
        </div>
        <div class="game-toprow">
          <div id="game-meta"></div>
          <span id="undo-request-note" hidden></span>
          <button id="request-undo-button" type="button" hidden>Request undo</button>
          <button id="undo-button" type="button" hidden>Undo my last action</button>
        </div>
        <div class="board-row">
          <div id="game-piles"></div>
          <div id="reaction-bar" title="Send a reaction">
            <button type="button" data-emoji="👏" title="Applause">👏</button>
            <button type="button" data-emoji="🤔" title="Thinking…">🤔</button>
            <button type="button" data-emoji="❓" title="Puzzled">❓</button>
            <button type="button" data-emoji="😱" title="Oh no">😱</button>
            <button type="button" data-emoji="❗" title="Careful!">❗</button>
          </div>
          <div id="latest-action"></div>
        </div>
        <div id="game-hands"></div>
        <div id="game-log"></div>
        <div id="game-discard"></div>
        <div class="game-footer">
          <button id="abandon-button" type="button" hidden>Abandon game</button>
        </div>
      </section>
    </main>

    <div id="game-detail-modal" class="modal" hidden>
      <div class="modal-body modal-wide">
        <div class="detail-head">
          <button type="button" id="game-detail-back" class="detail-back" title="Back" hidden>←</button>
          <h3 id="game-detail-title">Game</h3>
          <button type="button" id="game-detail-close" class="detail-close" title="Close (Esc)">✕</button>
        </div>
        <div id="game-detail-content"></div>
        <div class="modal-actions" id="game-detail-actions"></div>
      </div>
    </div>

    <div id="annotate-modal" class="modal" hidden>
      <div class="modal-body">
        <h3>Annotate card</h3>
        <div id="annotate-card-info"></div>
        <label class="checkbox">
          <input type="checkbox" id="annotate-guarded" />
          Guard this card (red marker on top)
        </label>
        <label>
          Note (private to you)
          <input id="annotate-note" maxlength="200" />
        </label>
        <div class="modal-actions">
          <button type="button" id="annotate-save">Save</button>
          <button type="button" id="annotate-cancel">Cancel</button>
        </div>
      </div>
    </div>

    <div id="card-action-overlay" hidden>
      <div id="card-action-popover"></div>
    </div>

    <div id="fireworks" aria-hidden="true"></div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
